Object DwarvenGoldenGolem
	; *** ART Parameters ***

	SelectPortrait         =  UPDwarven_Golem
	ButtonImage		= WOR_Guardian

	Scale = 6

	Draw = W3DHordeModelDraw ModuleTag_01
		OkToChangeModelColor = Yes	
		StaticModelLODMode = Yes

		WadingParticleSys = WaterRipplesTrail  ; used when the unit is wading in shallow water.
;;================ MODELS =================================================================
		DefaultModelConditionState
			Model               = EUDwarfGua_SKN
			Skeleton            = EUDwarfGua_SKL
			Texture					= eudwarfgua.tga DUGoldGolem.tga
		End	

;;=============== ANIMATIONS ===============================================================

;;======= FALLING & FLYING
		
		AnimationState        				= STUNNED_FLAILING 
			Animation           			= FlyA
				AnimationName       		= EUDwarfGua_FLYA
				AnimationMode       		= LOOP
				AnimationSpeedFactorRange	= 0.3 0.5
			End
			Animation           			= FlyB
				AnimationName       		= EUDwarfGua_FLYB
				AnimationMode       		= LOOP
				AnimationSpeedFactorRange	= 0.3 0.5
			End
			Animation           			= FlyC
				AnimationName       		= EUDwarfGua_FLYC
				AnimationMode       		= LOOP
				AnimationSpeedFactorRange	= 0.3 0.5
			End
			Flags               			= RANDOMSTART
		End

		AnimationState						= DYING BURNINGDEATH
			Animation
				AnimationName				= EUDwarfGua_DIEA
				AnimationMode				= ONCE
				AnimationBlendTime			= 10
			End
		End

		AnimationState 						= DYING SPLATTED
			Animation 						= Splatted_On_Ground
				AnimationName 				= EUDwarfGua_LNDA
				AnimationMode 				= ONCE
			End
			EnteringStateFX					= FX_OrcHitGround
		End
		
		AnimationState        				= DYING DEATH_2				; fading out.
			Animation
				AnimationName				= EUDwarfGua_IDLB
				AnimationMode				= LOOP
			End
		End
		
		AnimationState						= DYING
			Animation						= DIEB
				AnimationName				= EUDwarfGua_DIEA
				AnimationMode				= ONCE
			End
		End

		AnimationState						= PARALYZED
			Animation
				AnimationName				= EUDwarfGua_IDLA
				AnimationMode				= LOOP
			End
		End

;;======= LANDING & STANDING

		AnimationState						= STUNNED_STANDING_UP
			Animation						= GTPA
				AnimationName				= EUDwarfGua_GTPA
				AnimationMode				= ONCE
				AnimationSpeedFactorRange = 1.5 1.5
			End
		End
	
		AnimationState			=	 STUNNED
			Animation			=	 Slatted_On_Ground
			AnimationName 				= EUDwarfGua_LNDA
				AnimationMode 				= ONCE
			End
			EnteringStateFX					= FX_OrcHitGround

       	End 
				
		AnimationState						= MOVING ATTACKING
			ShareAnimation					= Yes;
			Animation						= RUNA
				AnimationName				= EUDwarfGua_RUNA
				AnimationMode				= LOOP
				AnimationSpeedFactorRange = 0.4 0.4
				Distance					= 25
			End
			Flags							= RANDOMSTART
			;ParticleSysBone				= None InfantryDustTrails
		End

		AnimationState						= MOVING
			;@@@KM - Add Distance
			ShareAnimation					= Yes;
			Animation						= RUNB
				AnimationName				= EUDwarfGua_RUNA
				AnimationMode				= LOOP
				AnimationSpeedFactorRange = 0.4 0.4
				Distance					= 30
			End
			Flags							= RANDOMSTART
			;ParticleSysBone				= None InfantryDustTrails
		End

;;---------------------- ATTACKING ----------------------------------------------------------------
		AnimationState						= FIRING_OR_PREATTACK_A
			Animation						= ATK1
				AnimationName				= EUDwarfGua_ATKA
				AnimationMode				= ONCE
				UseWeaponTiming				= Yes
			End
			;ParticleSysBone				= None MeleeDust
		End

		AnimationState						= FIRING_OR_PREATTACK_B
			Animation						= ATK1
				AnimationName				= EUDwarfGua_ATKB
				AnimationMode				= ONCE
				UseWeaponTiming				= Yes
			End
			;ParticleSysBone				= None MeleeDust
		End

		AnimationState						= ATTACKING
			Animation						= ALERT_1
				AnimationName				= EUDwarfGua_IDLA
				AnimationMode				= LOOP
			End
		End

;;----------------- SELECTED STATES -----------------------------------------------------------------------
		AnimationState        = SELECTED
			StateName           = STATE_Selected
			Animation           = ATNB
				AnimationName     = EUDwarfGua_ATNB
				AnimationMode     = LOOP
			End
			
			BeginScript
				Prev = CurDrawablePrevAnimationState()
				if Prev == "STATE_Idle" 
				then 
					CurDrawableSetTransitionAnimState("TRANS_IdleToSelected") 
				end
				if CurDrawableModelcondition("ATTACKING")
				then
					return "IDLA"
				else
					return "ATNA"
				end
			EndScript
			
			BeginScript
				Prev = CurDrawablePrevAnimationState()
				if Prev == "STATE_Idle" then CurDrawableSetTransitionAnimState("TRANS_IdleToSelected") end
			EndScript
		End
		
;;----------------- IDLE STATES ---------------------------------------------------------------------------
		IdleAnimationState
		    ;AllowRepeatInRandomPick = no
		    ;Flags = RANDOMSTART
			StateName				= STATE_Idle
            Animation				= ATNB
                AnimationName       = EUDwarfGua_ATNB ;default idle
				AnimationMode       = ONCE
				AnimationPriority   = 100 
				AnimationSpeedFactorRange = 0.9 1.1
				AnimationBlendTime	= 15
			End
			BeginScript
				Prev = CurDrawablePrevAnimationState()
				if Prev == "STATE_Selected" then CurDrawableSetTransitionAnimState("TRANS_SelectedToIdle") end
			EndScript
		End
;;--------------- TRANSITIONS ---------------------------------------------------------------------------
		TransitionState       = TRANS_IdleToSelected
			Animation           = ATNA
				AnimationName     = EUDwarfGua_ATNB
				AnimationMode     = ONCE
				AnimationSpeedFactorRange = 0.9 1.0
				
			End
		End
		TransitionState		= TRANS_SelectedToIdle
			Animation			= ATNC
				AnimationName	= EUDwarfGua_ATNB
				AnimationMode	= ONCE
				AnimationSpeedFactorRange = 0.9 1.0
			End
		End
	End

	Draw = W3DScriptedModelDraw DustEffects
	    DefaultModelConditionState
	      Model = None
	    End
	    IdleAnimationState
	    End
	    AnimationState =  MOVING WADING
			ParticleSysBone = None FootstepSlash
	    End
	    AnimationState = MOVING ACCELERATE
			ParticleSysBone = None GenericSiegeTrailDust
	    End
	    AnimationState =  MOVING ACCELERATE
			ParticleSysBone = None GenericSiegeTrailDust
	    End
	    AnimationState = MOUNTED MOVING
	    End
	End
	
