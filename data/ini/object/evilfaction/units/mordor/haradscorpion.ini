;//------------------------------------------------------------------------------
;// AKA HaradrimScorpion
Object MordorHaradGiantScorpion
	
	;// *** ART Parameters ***

	Scale = 1.3

	SelectPortrait = UPWild_Spiderlings 

	;// This is required for garrisoned objects - please put in all objects.
	ButtonImage = WOR_Spiderling
      
	Draw = W3DHordeModelDraw ModuleTag_01

		DefaultModelConditionState
			Model					= WUGbkMnt_SKN
			Skeleton				= WUGbkMnt_SKL
			Texture	= wuscorpion_c.tga MUHrdScorp.tga
		End

		IdleAnimationState
			StateName = Idle
			Animation
				AnimationName		=	WUGbkMnt_IDLB
				AnimationMode		=	LOOP
				AnimationBlendTime	=	30
			End
			BeginScript
				Prev = CurDrawablePrevAnimationState()
				if Prev == "STATE_PlantingTotem" then
					CurDrawableSetTransitionAnimState("TRANS_IdleFromSelectMountedNoBlend")
				elseif Prev ~= "Idle" and Prev ~= "TRANS_IdleFromSelectMounted" and Prev ~= "TRANS_IdleFromSelectMountedNoBlend" then
					CurDrawableSetTransitionAnimState("TRANS_IdleFromSelectMounted") 
				end
			EndScript
		End

		AnimationState			= STUNNED_FLAILING
			Animation
				AnimationName   = WUGbkMnt_FLYA
				AnimationMode   = LOOP
				AnimationSpeedFactorRange	= 0.2 0.3
			End
		End

		AnimationState				=	DYING
			Animation
				AnimationName		=	WUGbkMnt_DIEA
				AnimationMode		=	ONCE
			End
		End

		AnimationState			= BURNINGDEATH
			Animation
				AnimationMode	= LOOP
				;Distance		= 120
			End
		End
				
		AnimationState        = STUNNED
			Animation
				AnimationName     = WUGbkMnt_LNDA
				AnimationMode     = ONCE
			End
		End

		AnimationState        = STUNNED_STANDING_UP
			Animation
				AnimationName     = WUGbkMnt_GTPA
				AnimationMode     = ONCE
			End
		End	

		AnimationState						= PARALYZED
			Animation
				AnimationName				= WUGbkMnt_IDLB
				AnimationMode				= LOOP
			End
		End


		; battle frenzy anim
		AnimationState				= USER_1
			Animation
				AnimationName		= WUGbkMnt_SPCA
				AnimationMode		= ONCE
			End
		End

		; call from deep anim
		AnimationState				=  USER_2
			Animation
				AnimationName		= WUGbkMnt_SPCB
				AnimationMode		= ONCE
			End
		End

		AnimationState				=	FIRING_OR_PREATTACK_B
			Animation
				AnimationName		=	WUGbkMnt_ATKC
				AnimationMode		=	LOOP
				UseWeaponTiming		=	Yes
			End
		End
		
		AnimationState				=	FIRING_OR_PREATTACK_A
			Animation
				AnimationName		=	WUGbkMnt_ATKA
				AnimationMode		=	LOOP
				UseWeaponTiming		=	Yes
			End
		End
		
		; --- Poisoned Stinger Weapon anim
		AnimationState				= SPECIAL_WEAPON_ONE
			Animation
				AnimationName		= WUGbkMnt_ATKB
				AnimationMode		= ONCE
				UseWeaponTiming		= Yes
			End
			ParticleSysBone B_S_TAIL06 GoblinKingPoison FollowBone:Yes
			ParticleSysBone B_S_TAIL06 GoblinKingPoison2 FollowBone:Yes
		End

		AnimationState				= PACKING_TYPE_1
			StateName				= STATE_PlantingTotem
			Animation
				AnimationName		= WUGbkMnt_SPCC
				AnimationMode		= ONCE
			End
			;FXEvent	= Frame:20 FireWhenSkipped Name:FX_GoblinKingTotem
		End
    
		AnimationState				=	MOVING
			StateName				=	STATE_MountedMoving
			Animation
				AnimationName		=	WUGbkMnt_RUNA
				AnimationMode		=	LOOP
			End
		End
		
		AnimationState				=	RAISING_FLAG
			Animation
				AnimationName		=	WUGbkMnt_CHRA
				AnimationMode		=	LOOP
			End
		End
		
		AnimationState				=	SELECTED
			StateName				=	AtAttentionIdle
			Animation
				AnimationName		=	WUGbkMnt_ATNB
				AnimationMode		=	LOOP
				AnimationBlendTime	=	0
			End
			Flags					=	RESTART_ANIM_WHEN_COMPLETE
			BeginScript
				Prev = CurDrawablePrevAnimationState()
				if Prev == "STATE_PlantingTotem" then
					CurDrawableSetTransitionAnimState("TRANS_SelectFromSkullTotemMounted")
				elseif Prev == "STATE_MountedMoving" then
					CurDrawableSetTransitionAnimState("TRANS_SelectFromMovingMounted")
				elseif Prev ~= "AtAttentionIdle" and Prev ~= "TRANS_SelectFromIdleMounted" then
					CurDrawableSetTransitionAnimState("TRANS_SelectFromIdleMounted")
				end
			EndScript
		End

		AnimationState = ATTACKING
			Animation
				AnimationName = WuGbkMnt_IDLA
				AnimationMode = LOOP
			End
		End

		AnimationState				= HIT_REACTION
			Animation				= LevelUp
				AnimationName		= WUGbkMnt_HITA
				AnimationMode		= ONCE
			End
		End
		
		AnimationState				= LEVELED
			Animation				= LevelUp
				AnimationName		= WUGbkMnt_LVLA
				AnimationMode		= ONCE
			End
		End

		
		TransitionState				=	TRANS_SelectFromIdleMounted
			Animation
				AnimationName		=	WUGbkMnt_ATNA
				AnimationMode		=	ONCE
			End
		End
		TransitionState				=	TRANS_SelectFromSkullTotemMounted
			Animation
				AnimationName		=	WUGbkMnt_ATNB
				AnimationMode		=	ONCE
				AnimationBlendTime	=	0
			End
		End
		TransitionState				=	TRANS_SelectFromMovingMounted
			Animation
				AnimationName		=	WUGbkMnt_ATNB
				AnimationMode		=	ONCE
			End
		End

		TransitionState				=	TRANS_IdleFromSelectMountedNoBlend
			Animation
				AnimationName		=	WUGbkMnt_ATNC
				AnimationMode		=	ONCE
				AnimationBlendTime	=	0
			End
		End
		TransitionState				=	TRANS_IdleFromSelectMounted
			Animation
				AnimationName		=	WUGbkMnt_ATNC
				AnimationMode		=	ONCE
			End
		End

		AnimationState				=	EMOTION_CELEBRATING
			Animation
				AnimationName		=	WUGbkMnt_CHRA
				AnimationMode		=	LOOP
			End
		End
	End

	Draw = W3DScriptedModelDraw DustEffects
	    DefaultModelConditionState
	      Model = None
	    End
	    IdleAnimationState
	    End
	    AnimationState = MOVING WADING
			ParticleSysBone = None FootstepSlash
	    End
	    AnimationState = MOVING ACCELERATE
			ParticleSysBone = None GenericSiegeTrailDust
	    End
	    AnimationState = MOVING ACCELERATE
			ParticleSysBone = None GenericSiegeTrailDust
	    End
	    AnimationState = DISGUISED MOVING ACCELERATE
			ParticleSysBone = None GenericSiegeTrailDust
	    End
	    AnimationState = DISGUISED MOVING DECELERATE
			ParticleSysBone = None GenericSiegeTrailDust
	    End
	    AnimationState = MOVING
	    End
        AnimationState = DISGUISED MOVING
        End
	End
	
    #include "..\..\..\includes\StunDrawModuleSmall.inc"

	;// ***DESIGN parameters ***
	Side			= Mordor
	EditorSorting		= UNIT
	ThreatLevel		= 1.0
	BountyValue		= MORDOR_HARADSCORPION_BOUNTY_VALUE
	
	VisionRange		= VISION_STANDARD_MELEE
	ShroudClearingRange 	= SHROUD_CLEAR_TROLL ;SHROUD_CLEAR_STANDARD       
	
	DisplayName		= OBJECT:MordorHaradGiantScorpion
	BuildCost		= MORDOR_HARADSCORPION_BUILDCOST
	BuildTime		= MORDOR_HARADSCORPION_BUILDTIME
	CommandSet		= MordorHaradGiantScorpionCommandSet
	CommandPoints		= 30
	TransportSlotCount	= TRANSPORTSLOTCOUNT_UNIT

	ShockwaveResistance = SHOCKWAVE_RESISTANCE_MEDIUM

	CrushableLevel		= 2  ;What am I?:        0 = for infantry, 1 = for trees, 2 = general vehicles
	CrusherLevel = 1

	CrushWeapon = GiantSpiderCrush

	MinCrushVelocityPercent = 40 ; Has to be moving at at least 50% of full speed.
	CrushDecelerationPercent = 20 ; Lose 80 percent of max velocity when crushing.

	UseCrushAttack = No

	RamPower = 30;
	RamZMult = 0.5;
	
	WeaponSet
		Conditions 	= None
		Weapon 		= PRIMARY  GiantScorpionClaws
		AutoChooseSources = PRIMARY FROM_PLAYER FROM_SCRIPT FROM_AI
	End

	ArmorSet
		Conditions      = None
		Armor           = GiantScorpionArmor
		DamageFX        = NormalDamageFX
	End


	;// *** AUDIO Parameters ***;

	;VoiceAmbushed			= WildSpiderlingVoxHurt	  OBSOLETE VOICE
	VoiceAttack			= WildSpiderlingVoxAttack
	VoiceAttackCharge		= WildSpiderlingVoxAttack
	VoiceAttackMachine		= WildSpiderlingVoxAttack
	VoiceAttackStructure		= WildSpiderlingVoxAttack
	VoiceCreated			= EVA:SpiderlingsCreated
	VoiceCreated			= +SOUND:WildSpiderlingVoxCreated
	VoiceFullyCreated		= EVA:SpiderlingsCreated
	VoiceFullyCreated		= +SOUND:WildSpiderlingVoxCreated
	VoiceFear			= WildSpiderlingVoxHurt
	VoiceGuard			= WildSpiderlingVoxMove
	VoiceMove			= WildSpiderlingVoxMove
	VoiceMoveOverWalls		= WildSpiderlingVoxMove
	VoiceMoveToCamp			= WildSpiderlingVoxMove
	VoiceMoveWhileAttacking		= WildSpiderlingVoxMove
	VoicePriority			= 50
	VoiceRetreatToCastle		= WildSpiderlingVoxHurt
	VoiceSelect			= WildSpiderlingVoxSelectMS
	VoiceSelectBattle 		= WildSpiderlingVoxSelectBattleMS

	VoiceEnterStateAttack			= WildSpiderlingVoxEnterStateAttack
	VoiceEnterStateAttackCharge		= WildSpiderlingVoxEnterStateAttack
	VoiceEnterStateAttackMachine		= WildSpiderlingVoxEnterStateAttack
	VoiceEnterStateAttackStructure		= WildSpiderlingVoxEnterStateAttack
	VoiceEnterStateMove			= WildSpiderlingVoxEnterStateMove
	VoiceEnterStateMoveOverWalls		= WildSpiderlingVoxEnterStateMove
	VoiceEnterStateMoveToCamp		= WildSpiderlingVoxEnterStateMove
	VoiceEnterStateMoveWhileAttacking	= WildSpiderlingVoxEnterStateMove
	VoiceEnterStateRetreatToCastle		= WildSpiderlingVoxEnterStateHurt

	SoundAmbient				= WildSpiderlingAmbientLoopMS
	SoundImpact				= ImpactHorse
	; SoundMoveLoop				= WildSpiderlingMoveLoop Sorry, doesn't work on horde members. Use LGAS instead
 
	UnitSpecificSounds
		VoiceGarrison				= WildSpiderlingVoxMove
		VoiceEnterUnitEvilMenTransportShip	= WildSpiderlingVoxMove
	End

	ClientBehavior = AnimationSoundClientBehavior ModuleTag_AnimAudioBehavior
		MaxUpdateRangeCap = 800
		AnimationSound = Sound:BodyFallGeneric2		Animation:MUGNTSPDR_SKL.MUGNTSPDR_LNDA		Frames:5
	End

    #include "..\..\..\includes\StandardUnitEvaEvents.inc"

	;ClientBehavior = ModelConditionAudioLoopClientBehavior ModuleTag_ModelConditionAudioLoop
	;	ModelCondition = Required:MOVING Sound:WildSpiderlingMoveLoop
	;End

	Behavior = LargeGroupAudioUpdate ModuleTag_LGAU		;Tie into LargeGroupAudio system
		Key = Spiderling
	End

	;// *** ENGINEERING Parameters ***

	RadarPriority	= UNIT
	KindOf			= SELECTABLE CAN_ATTACK ATTACK_NEEDS_LINE_OF_SIGHT MONSTER PRELOAD SCORE PATH_THROUGH_EACH_OTHER ARMY_SUMMARY CAN_CLIMB_WALLS CAN_ATTACK_WALLS
	
	Behavior = AIUpdateInterface ModuleTag_03
		AutoAcquireEnemiesWhenIdle	= Yes ATTACK_BUILDINGS
		MoodAttackCheckRate			= 500
		AILuaEventsList				= ShelobFunctions
		MaxCowerTime				= 7500
		MinCowerTime				= 5000
		BurningDeathTime			= BURNINGDEATH_DURATION_INFANTRY
	End
	
	Behavior = EmotionTrackerUpdate	Module_EmotionTracker
		AddEmotion	=	Terror_Base
		AddEmotion	=	OVERRIDE UncontrollableFear_Base_Evil
			Duration			=	7000	
		End
		
		AlwaysAfraidOf		=	NONE +CloudBreakSunbeam +SunflareSunbeam

		AddEmotion	=	Alert_Base
	End

	;LocomotorSet
		;Locomotor     = SpiderlingLocomotor
		;Condition     = SET_NORMAL
		;Speed         = NORMAL_WILD_CAVALRY_FAST_MEMBER_SPEED
	;End

	LocomotorSet
		Locomotor     = ScorpionLocomotor
		Condition     = SET_NORMAL
		Speed         = NORMAL_MONSTER_FAST_SPEED
	End

	LocomotorSet
		Locomotor = BurningDeathLocomotorInfantry
		Condition = SET_BURNINGDEATH
		Speed	  = BURNINGDEATH_WANDERSPEED_INFANTRY
	End

	Body = ActiveBody ModuleTag_Body
		MaxHealth 		= MORDOR_HARADSCORPION_HEALTH  
		MaxHealthDamaged 	= MORDOR_HARADSCORPION_HEALTH_DAMAGED
		BurningDeathBehavior = Yes
		BurningDeathFX       = FX_InfantryBurningFlame
		DodgePercent 	= medium_UNIT_DODGE_PERCENT
	End
	
	Behavior = PhysicsBehavior ModuleTag_04
		GravityMult = 1.0
	End
	
	Behavior = SlowDeathBehavior ModuleTag_05
		DeathTypes			= ALL -FADED
		SinkDelay			= 3000
		SinkRate			= 6.5     ; in Dist/Sec
		DestructionDelay	= 8000
		FX					= INITIAL FX_SmallSpiderDie
		Sound				= INITIAL WildSpiderlingVoxDie
	End
	
	Behavior = SlowDeathBehavior ModuleTag_SlowDeathFaded
		DeathTypes			= NONE +FADED
		FadeDelay			= 0
		FadeTime			= 3000
		DestructionDelay	= 3000
		FX					= INITIAL FX_SmallSpiderDie
		DeathFlags			= DEATH_1
		Sound = INITIAL SpellGenericUnsummonFasterMS
	End

	; REMOVE FAT BOY
	Behavior = SubObjectsUpgrade RemoveGorkil
		TriggeredBy		= Upgrade_ObjectLevel1
		HideSubObjects	= RIDER
	End
	
	;-----------------------------------------------------------------------------
	;	Poisoned Stinger
	;-----------------------------------------------------------------------------	
	Behavior = SpecialPowerModule ModuleTag_GoblinKingPoisonedStingerStarter
		SpecialPowerTemplate      = SpecialAbilityGoblinKingPoisonedStinger
		UpdateModuleStartsAttack  = Yes
		StartsPaused				= No
		; InitiateSound = GoblinKingVoiceAttackStinger
	End
	Behavior = WeaponFireSpecialAbilityUpdate ModuleTag_GoblinKingPoisonedStingerUpdate
		SpecialPowerTemplate    = SpecialAbilityGoblinKingPoisonedStinger
		SkipContinue			= Yes
		UnpackTime				= 250
		PreparationTime			= 1
		PersistentPrepTime		= 500
		PackTime				= 100
		MustFinishAbility		= Yes
		AwardXPForTriggering		= 0		
		StartAbilityRange			= 15.0
		SpecialWeapon				= GiantScorpionPoisonedStinger
		WhichSpecialWeapon			= 1
	End
	Behavior = AutoAbilityBehavior ModuleTag_AutoAbilityyPoisonedStinger
		SpecialAbility = SpecialAbilityGoblinKingPoisonedStinger
		MaxScanRange	= 50
		StartsActive				= Yes
		Query = 1 ANY +HERO +MONSTER +TROLL -STRUCTURE ENEMIES
	End

	; Generic
	Behavior = AutoAbilityBehavior ModuleTag_AutoAbilityBehavior
	End
	
	Behavior = SquishCollide ModuleTag_06
		;//nothing
	End

	Behavior = AutoHealBehavior ModuleTag_VeterancyHealing
		StartsActive				= No
		TriggeredBy					= Upgrade_ObjectLevel5
		HealingAmount				= MONSTER_HEAL_AMOUNT
		HealingDelay				= 1000
		StartHealingDelay 		= MONSTER_HEAL_DELAY
		HealOnlyIfNotInCombat = Yes
	End
	
	Geometry		= CYLINDER
	GeometryMajorRadius	= 17.6
	GeometryHeight		= 32.0
	GeometryIsSmall		= No
	Shadow			= SHADOW_VOLUME_NON_SELF_2	;// volumetric shadow that doesn't cast onto all objects using SHADOW_VOLUME_NON_SELF_2

	Shadow			= SHADOW_DECAL ;SHADOW_VOLUME
	ShadowSizeX		= 22
	ShadowSizeY		= 18
	ShadowOffsetX	= -1
	ShadowTexture	= ShadowI	;ShadowSpider2	;
End