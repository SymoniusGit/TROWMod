    ; SelectPortrait for Heros is portrait behind skill buttons. HP = HeroPortrait.
	SelectPortrait = HPGorthaur
    
    ; ButtonImage for Heros is button image on Hero Select UI to select hero. HI = HeroIcon or HeroImage.
	ButtonImage = HIGorthaur
	
	DescriptionStrategic = CONTROLBAR:LW_ToolTip_Glorfindel
    
	Draw = W3DScriptedModelDraw ModuleTag_DRAW

		;WadingParticleSys = EntRipples
		StaticModelLODMode = yes ; Will append M or L to the skin name depending on GameLOD
		OkToChangeModelColor = Yes

		DefaultModelConditionState
			Model					= EUGlrfdl_SKN
			Skeleton				= EUGlrfdl_SKL
			Texture = euglrfdl_c.tga MUgorthaur.tga
			ParticleSysBone     = None GorthaurFlare FXTrigger:NONE Persist:SPAWN PersistID:100
		End

		; --- Transition Anims

		; --- Idle Anims
		IdleAnimationState
			Animation				= IDLB
				AnimationName		= EUGlrfdl_IDLB
				AnimationMode		= ONCE
			End
			Animation				= IDLC
				AnimationName		= EUGlrfdl_IDLC
				AnimationMode		= ONCE
			End
			Animation				= IDLD
				AnimationName		= EUGlrfdl_IDLD
				AnimationMode		= ONCE
			End
			Animation				= IDLE
				AnimationName		= EUGlrfdl_IDLE
				AnimationMode		= ONCE
			End
			StateName				= Idle
			BeginScript
				CurDrawableHideSubObject("spear")
				Prev = CurDrawablePrevAnimationState()
				if Prev == "Selected" then CurDrawableSetTransitionAnimState("TRANS_Selected_To_Idle") end
			EndScript

		End
		
		; --- Blink
		AnimationState        = PACKING_TYPE_1
			Animation           = CHRA
				AnimationName     = KUKng_SKL.KUKng_CHRA
				AnimationMode     = ONCE
			End
		End

; --- moving aims

		AnimationState			= STUNNED_FLAILING 
