			Animation
				AnimationName   = EUGlrfdl_FLYA
				AnimationMode   = LOOP
				AnimationSpeedFactorRange	= 0.4 0.6
			End
			StateName           = NoSword
			BeginScript
				Prev = CurDrawablePrevAnimationState()
				if Prev == "Sword" then CurDrawableSetTransitionAnimState("TRANS_SheatheSword") end
			EndScript
		End

		AnimationState			= STUNNED_STANDING_UP
			Animation
				AnimationName   = EUGlrfdl_GTPA
				AnimationMode   = ONCE
				AnimationSpeedFactorRange= 1.5 1.5
			End
		End

		AnimationState			= STUNNED 
			Animation
				AnimationName   = EUGlrfdl_LNDA
				AnimationMode   = ONCE
			End
			StateName           = NoSword
			BeginScript
				Prev = CurDrawablePrevAnimationState()
				if Prev == "Sword" then CurDrawableSetTransitionAnimState("TRANS_SheatheSword") end
			EndScript
		End

		; --- Dying anims
		AnimationState				=	DYING SPLATTED
			Animation
				AnimationName		=	EUGlrfdl_LNDA
				AnimationMode		=	ONCE
			End
			StateName				=	NoSword
			BeginScript
				Prev = CurDrawablePrevAnimationState()
				if Prev == "Sword" then CurDrawableSetTransitionAnimState("TRANS_SheatheSword") end
			EndScript
		End
		AnimationState        = DYING AFLAME
			Animation = DieAflame
				AnimationName           = EUGlrfdl_MFDA
				AnimationMode       = LOOP
			End
		End
		

		AnimationState				=	DYING
			Animation
				AnimationName		=	EUGlrfdl_DTHA
				AnimationMode		=	ONCE
