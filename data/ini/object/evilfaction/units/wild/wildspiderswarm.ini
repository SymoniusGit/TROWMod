Object WildSpiderSwarm
	;// *** ART Parameters ***

    ;// ButtonImage for Heros is button image on Hero Select UI to select hero. HI = HeroIcon or HeroImage.
    ButtonImage			= HICaveBats
    SelectPortrait		= UPBatCloud   

	Scale = 2.0 

	Draw = W3DHordeModelDraw ModuleTag_01
		;// OkToChangeModelColor = Yes ; temporarily commented out to remove the house color

		WadingParticleSys = EntRipples

		StaticModelLODMode = Yes ; Will append M or L to the skin name depending on GameLOD

		ExtraPublicBone = BODY_30

		DefaultModelConditionState
			Model					= MUShelob_SKN
		End

	End
	
	;// ***DESIGN parameters ***
	Side				= Wild
	EditorSorting		= UNIT
	ThreatLevel			= WILD_SPIDERSWARM_THREAT
	CommandPoints			= WILD_SPIDERSWARM_CP			; originally 25
	ShockwaveResistance = SHOCKWAVE_RESISTANCE_IMMUNE

	VisionRange			= 200.0
	DisplayName			= OBJECT:WildSpiderSwarm
	
	CommandSet			= SpiderSwarmCommandSet

	BuildCost		= WILD_SPIDERSWARM_BUILD_COST
	BuildTime		= WILD_SPIDERSWARM_BUILD_TIME	

	;// *** AUDIO Parameters ***
	EvaEnemyObjectSightedEvent	= None  ;// Don't bother player about this object showing up over their base -- happens too much to bother

	;SoundAmbient = CrebainAmbientLoop
	;SoundMoveStart = CrebainSelect

	;VoiceSelect = CrebainSelect

	;// *** ENGINEERING Parameters ***
	RadarPriority = UNIT
	;KindOf = SELECTABLE MONSTER CAN_CAST_REFLECTIONS SCORE NO_FREEWILL_ENTER
	KindOf = PRELOAD SELECTABLE CAN_CAST_REFLECTIONS MONSTER CAN_ATTACK ATTACK_NEEDS_LINE_OF_SIGHT SCORE ARMY_SUMMARY PATH_THROUGH_EACH_OTHER PATH_THROUGH_INFANTRY
	
	Body = ActiveBody ModuleTag_02
		MaxHealth         = WILD_SPIDERSWARM_HEALTH
		MaxHealthDamaged  = WILD_SPIDERSWARM_HEALTH_DAMAGED	
		DodgePercent     		= 75  ;HERO_DODGE_PERCENT	
	End

	Behavior = AIUpdateInterface ModuleTag_03
		AutoAcquireEnemiesWhenIdle	= Yes ;ATTACK_BUILDINGS
		MoodAttackCheckRate			= 500
		MaxCowerTime				= 7500
		MinCowerTime				= 5000
		BurningDeathTime			= BURNINGDEATH_DURATION_INFANTRY
	End

	Behavior = PhysicsBehavior		ModuleTag_PhysicsBehavior
	End
	
	Behavior = SlowDeathBehavior ModuleTag_NormalDeath			; Nuked
		DeathTypes			= ALL
        DeathFlags			= DEATH_1
		DestructionDelay	= 2000
		SinkDelay			= 2000
		;SinkRate			= 0.64								; in Dist/Sec
		Sound = INITIAL SpellGenericUnsummonFasterMS
	End

	Behavior = PickupStuffUpdate ModuleTag_PickupStuffUpdate
		SkirmishAIOnly = Yes
		StuffToPickUp = NONE +CRATE
		ScanRange = 200
		ScanIntervalSeconds = 0.5
	End

  	ArmorSet
		Conditions      = None
		Armor           = BatsArmor
		DamageFX        = None
 	End

	WeaponSet
		Conditions		= None 
		Weapon			= PRIMARY WildSpiderSwarmMandibles
		AutoChooseSources	= PRIMARY FROM_PLAYER FROM_SCRIPT FROM_AI
	End

	LocomotorSet
		Locomotor     = TestWallScalingHordeLocomotor
		Condition     = SET_NORMAL
		Speed         = NORMAL_MONSTER_FAST_SPEED
	End

	; REMOVE BATS
	Behavior = SubObjectsUpgrade RemoveBats
		TriggeredBy		= Upgrade_ObjectLevel1
		HideSubObjects	= BATS_01
		HideSubObjects	= BATS_02
		HideSubObjects	= BATS_03
		HideSubObjects	= SHELOB
	End

	; SWARM
	Behavior = QueueProductionExitUpdate ModuleTag_017
		UnitCreatePoint = X:0.0 Y:0.0 Z:0.0
		NaturalRallyPoint = X:0.0 Y:0.0 Z:0.0
		ExitDelay = 0
		PlacementViewAngle = 45
	End
	Behavior = SpawnBehavior ModuleTag_SpawnSpiders
		SpawnNumber				= 30	;50	;100
		InitialBurst			= 30	;50	;100
		SpawnTemplateName		= WildSpiderSwarm_Slave
		SpawnReplaceDelay		= 0
		; CanReclaimOrphans		= Yes
		SpawnedRequireSpawner	= Yes
		ShareUpgrades	= Yes
	End

	;----------------------------Life Drain-----------------------------------------	
	Behavior = FireWeaponUpdate ModuleTag_WeaponFiring
		FireWeaponNugget
			WeaponName = LifeDrainRadiusWeapon
			Offset = X:0 Y:0 Z:0
			FireDelay = 0
			OneShot = No
		End
	End

	;---------DREAD VISAGE------------------------------------------------------------------------
	Behavior = UnpauseSpecialPowerUpgrade ModuleTag_DreadVisage
		SpecialPowerTemplate		= SpecialAbilityFakeLeadership
		;TriggeredBy					= Upgrade_DreadVisage
	End
	Behavior = SpecialPowerModule ModuleTag_DreadVisageUpdate
		SpecialPowerTemplate		= SpecialAbilityFakeLeadership
		UpdateModuleStartsAttack	= Yes
		StartsPaused				= No ;Yes
	End
	Behavior = AttributeModifierAuraUpdate ModuleTag_DreadVisageAura
		StartsActive	= Yes														;If no, requires upgrade to turn on.
		;TriggeredBy		= Upgrade_DreadVisage
		RefreshDelay	= 2000
		Range			= WILD_SPIDERSWARM_DREADVISAGE_EFFECT_RADIUS
		TargetEnemy		= Yes
		AntiCategory	= LEADERSHIP BUFF
		BonusName		= GenericSoftDebuff
		ObjectFilter	= ANY +INFANTRY +CAVALRY -STRUCTURE -BASE_FOUNDATION -HERO -HORDE
	End
	Behavior = RadiateFearUpdate ModuleTag_DreadVisageFear
		InitiallyActive						= Yes
		TriggeredBy							= Upgrade_DreadVisage
		WhichSpecialPower					= 1
		GenerateFear						= Yes
		EmotionPulseRadius					= WILD_SPIDERSWARM_DREADVISAGE_EFFECT_RADIUS
		EmotionPulseInterval				= 2000
	End

	Behavior = AutoHealBehavior ModuleTag_VeterancyHealing
		StartsActive				= No
		TriggeredBy					= Upgrade_ObjectLevel5
		HealingAmount				= MONSTER_HEAL_AMOUNT
		HealingDelay				= 1000
		StartHealingDelay 		= MONSTER_HEAL_DELAY
		HealOnlyIfNotInCombat = Yes
	End

	#include "..\..\..\includes\DefaultInvisibilityUpdate.inc"

	// *** AUTO RESOLVE DATA *** 
	AutoResolveUnitType = AutoResolveUnit_Support
	AutoResolveCombatChain = AutoResolve_CavalryCombatChain

	AutoResolveBody = AutoResolve_WildWarBatsBody

	AutoResolveArmor
		Armor = AutoResolve_WildWarBatsArmor
	End

	AutoResolveWeapon
		Weapon = AutoResolve_WildWarBatsWeapon
	End

	Geometry			= CYLINDER
	GeometryMajorRadius = 10.0
	GeometryHeight		= 1.0
	GeometryIsSmall		= Yes	;No
End

